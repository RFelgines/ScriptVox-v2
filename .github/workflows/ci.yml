# CI « clone frais » — vérifie qu'un checkout vierge du dépôt build, se lint et passe ses tests.
# Née de l'incident des fichiers fantômes (2026-07-11) : framer-motion non déclaré,
# ui/Select.tsx jamais commité, prop tone de StatusBadge jamais poussée — trois
# casses invisibles depuis la machine de dev, détectées seulement sur clone frais.
# Audit 2026-09-25 : la CI lance maintenant TOUTES les suites de tests (elle n'en lançait aucune).
name: CI

on:
  push:
    branches: [main, "claude/**", "audit/**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Le build de production résout tous les imports et types de toutes les
      # routes — c'est lui qui attrape les fichiers oubliés en local.
      - run: npm run build
      # Avis de sécurité sur les dépendances de production (informatif : n'échoue pas le build).
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    # 3.13 est signalé mais non bloquant tant que toutes les dépendances épinglées n'y ont pas
    # de roue validée (3.11 et 3.12 sont la référence).
    continue-on-error: ${{ matrix.python-version == '3.13' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # ffmpeg : nécessaire aux tests de l'export M4B chapitré.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt ruff pip-audit
      # Même setup que le README : la config de l'exemple doit suffire à charger l'app.
      - run: cp .env.example .env
      - run: python -m compileall -q app
      # Erreurs de syntaxe / imports inutilisés / noms indéfinis (pas de règles de style).
      - run: ruff check --select E9,F app scripts plugins tests/run_all.py
      # Importe chaque module de app/ — attrape les fichiers manquants et les
      # imports cassés que compileall ne résout pas.
      - name: Import de tous les modules
        run: |
          python - <<'EOF'
          import importlib, pathlib
          fails = []
          for p in sorted(pathlib.Path("app").rglob("*.py")):
              mod = str(p.with_suffix("")).replace("/", ".")
              try:
                  importlib.import_module(mod)
              except Exception as e:
                  fails.append((mod, repr(e)))
          for m, e in fails:
              print(f"{m} -> {e}")
          raise SystemExit(1 if fails else 0)
          EOF
      # Toutes les suites tests/check_phase*.py (hors ligne : LLM, TTS et réseau sont simulés).
      - run: python tests/run_all.py
      # Avis de sécurité sur les dépendances (informatif : n'échoue pas le build).
      - run: pip-audit -r requirements.txt
        continue-on-error: true
